        * {

            padding: 0;
            box-sizing: border-box;
        }

        body {

            background: #0a0e27;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;

        /* Animated background */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        .bg-animation::before {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 20% 50%, rgba(120, 119, 198, 0.3) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(255, 98, 145, 0.3) 0%, transparent 50%),
                        radial-gradient(circle at 40% 20%, rgba(138, 43, 226, 0.3) 0%, transparent 50%);
            animation: bgMove 20s ease-in-out infinite;
        }

        @keyframes bgMove {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(-5%, -5%) rotate(120deg); }
            66% { transform: translate(5%, 5%) rotate(240deg); }
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
        }

            text-align: center;
            margin-bottom: 60px;
            animation: fadeInDown 1s ease;
        }

        .logo {
            font-size: 3.5em;
            font-weight: 800;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            text-shadow: 0 0 30px rgba(102, 126, 234, 0.5);
        }

        .tagline {
            font-size: 1.3em;
            color: rgba(255, 255, 255, 0.8);
            font-weight: 300;
            letter-spacing: 2px;
        }

        /* Search Section */
        .search-section {
            margin-bottom: 50px;
            animation: fadeIn 1.2s ease;
        }

        .search-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 60px;
            padding: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        .search-container:focus-within {
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 20px 80px rgba(102, 126, 234, 0.4);
        }

        .search-icon {
            font-size: 1.5em;
            padding-left: 20px;
            color: rgba(255, 255, 255, 0.6);
        }

        .search-input {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            font-size: 1.1em;
            padding: 15px;
            color: white;
            font-family: 'Poppins', sans-serif;
        }

        .search-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        /* Categories */
        .categories {
            display: flex;
            gap: 15px;
            margin-bottom: 50px;
            flex-wrap: wrap;
            justify-content: center;
            animation: fadeIn 1.4s ease;
        }

        .category-chip {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 12px 30px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .category-chip::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .category-chip span {
            position: relative;
            z-index: 1;
        }

        .category-chip:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .category-chip.active::before {
            opacity: 1;
        }

        .category-chip.active {
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.6);
        }

        /* Deals Grid */
        .deals-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 30px;
            animation: fadeInUp 1.5s ease;
        }

        .deal-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 25px;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            cursor: pointer;
        }

        .deal-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .deal-card:hover::before {
            opacity: 1;
        }

        .deal-card:hover {
            transform: translateY(-15px) scale(1.02);
            box-shadow: 0 30px 80px rgba(102, 126, 234, 0.4);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .deal-image {
            width: 100%;
            height: 220px;
            object-fit: cover;
            position: relative;
        }

            position: absolute;
            top: 20px;
            right: 20px;

            color: white;
            padding: 8px 20px;
            border-radius: 25px;
            font-weight: 600;
            font-size: 0.9em;
            box-shadow: 0 10px 30px rgba(245, 87, 108, 0.4);
            z-index: 2;
        }

        .deal-content {
            padding: 25px;
            position: relative;
        }

        .store-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .store-logo {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            object-fit: contain;
            background: white;
            padding: 5px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

            align-items: center;
            justify-content: center;

            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .store-name {
            font-size: 1em;
            color: rgba(255, 255, 255, 0.7);
            font-weight: 500;
        }

        .deal-title {

            font-weight: 700;
            color: white;

            line-height: 1.3;

        .deal-description {

            line-height: 1.6;

        .code-container {

            padding: 20px;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }

            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;

            border-radius: 15px;
            transition: opacity 0.3s ease;
            z-index: 0;
        }

        .code-container:hover::before {

        }

            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: space-between;

            font-weight: 700;
            color: #667eea;
            letter-spacing: 3px;

            color: white;
            padding: 12px 25px;
            border-radius: 10px;

            font-weight: 600;
            font-family: 'Poppins', sans-serif;

            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .copy-button:hover {

        }

        .copy-button.copied {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);

            justify-content: space-between;

            border-top: 1px solid rgba(255, 255, 255, 0.1);

            font-size: 0.85em;

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 40px;
            right: 40px;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);

            padding: 20px 30px;
            border-radius: 15px;

            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .toast.show {
            transform: translateX(0);
        }

        /* Stats Section */
        .stats-section {

            gap: 20px;
            margin-bottom: 50px;
            animation: fadeIn 1.6s ease;

            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.08);
        }

            font-size: 2.5em;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-label {
            color: rgba(255, 255, 255, 0.7);
            font-size: 1em;
            margin-top: 5px;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .logo {
                font-size: 2.5em;
            }

            .tagline {
                font-size: 1em;
            }

            .deals-grid {
                grid-template-columns: 1fr;
            }

            .toast {
                right: 20px;
                bottom: 20px;
            }
        }

        /* Floating particles */
        .particle {
            position: fixed;
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            pointer-events: none;
            animation: float 15s infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) translateX(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) translateX(100px);
                opacity: 0;
            }
        }
    </style>
</head>

                code: "PRIME1AYBEDAVA",

            {

                logo: "https://logo.clearbit.com/mango.com",

                title: "Aksesuar ve Çantalarda %35",
                description: "Tüm aksesuar kategorisinde özel indirim! Yeni sezon modelleri dahil.",
                code: "MANGO35",
                discount: "35% İndirim",
                expiry: "12 Mart 2026",

                category: "fashion"
            }
        ];

        function createParticles() {
            for (let i = 0; i < 50; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 15 + 's';
                particle.style.animationDuration = (Math.random() * 10 + 10) + 's';
                document.body.appendChild(particle);
            }
        }

        function renderDeals(filteredDeals) {
            const dealsGrid = document.getElementById('dealsGrid');
            dealsGrid.innerHTML = '';

            filteredDeals.forEach((deal, index) => {
                const card = document.createElement('div');
                card.className = 'deal-card';
                card.style.animationDelay = `${index * 0.1}s`;
                
                card.innerHTML = `
                    <div style="position: relative;">
                        <img src="${deal.image}" alt="${deal.store}" class="deal-image">
                        <div class="deal-badge">${deal.discount}</div>
                    </div>
                    <div class="deal-content">
                        <div class="store-header">
                            <img src="${deal.logo}" alt="${deal.store}" class="store-logo" 
                                 onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                            <div class="store-logo-fallback" style="display:none;">${deal.icon}</div>
                            <span class="store-name">${deal.store}</span>
                        </div>
                        <h3 class="deal-title">${deal.title}</h3>
                        <p class="deal-description">${deal.description}</p>
                        <div class="code-container">
                            <div class="code-wrapper">
                                <span class="code-text">${deal.code}</span>
                                <button class="copy-button" onclick="copyCode('${deal.code}', this)">
                                    📋 Kopyala
                                </button>
                            </div>
                        </div>
                        <div class="deal-footer">
                            <span class="expiry-date">
                                ⏰ ${deal.expiry}
                            </span>
                            <span class="use-count">
                                🔥 ${deal.uses} kişi kullandı
                            </span>
                        </div>
                    </div>
                `;
                
                dealsGrid.appendChild(card);
            });
        }

        function copyCode(code, button) {
            navigator.clipboard.writeText(code).then(() => {
                const originalText = button.innerHTML;
                button.innerHTML = '✅ Kopyalandı';
                button.classList.add('copied');
                
                const toast = document.getElementById('toast');
                toast.classList.add('show');
                
                setTimeout(() => {
                    button.innerHTML = originalText;
                    button.classList.remove('copied');
                    toast.classList.remove('show');
                }, 2500);
            });
        }

        // Category filtering
        document.querySelectorAll('.category-chip').forEach(chip => {
            chip.addEventListener('click', () => {
                document.querySelectorAll('.category-chip').forEach(c => c.classList.remove('active'));
                chip.classList.add('active');
                
                const category = chip.dataset.category;
                const filtered = category === 'all' ? deals : deals.filter(d => d.category === category);
                renderDeals(filtered);
            });
        });

        // Search functionality
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            const activeCategory = document.querySelector('.category-chip.active').dataset.category;
            
            let filtered = activeCategory === 'all' ? deals : deals.filter(d => d.category === activeCategory);
            
            if (searchTerm) {
                filtered = filtered.filter(d => 
                    d.store.toLowerCase().includes(searchTerm) ||
                    d.title.toLowerCase().includes(searchTerm) ||
                    d.description.toLowerCase().includes(searchTerm) ||
                    d.code.toLowerCase().includes(searchTerm)
                );
            }
            
            renderDeals(filtered);
        });

        // Initialize
        createParticles();
        renderDeals(deals);
    </script>
</body>
</html>
